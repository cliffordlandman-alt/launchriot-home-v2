<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaunchRiot | Executive setup for busy directors</title>
<meta name="description" content="A private assistant workspace for busy directors: email, calendar, messages, tasks and follow-ups in one place. Nothing is sent without your approval.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101216">
<link rel="icon" href="logo_full.png">
<style>
:root{--paper:#101216;--paper2:#1a1d23;--card:#171a20;--ink:#f1f4f2;--muted:#a8b1ad;--line:#2a2f37;--mint:#82e6ba;--mint-hi:#a6f0cf;--dark:#101216}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--mint)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.preview{background:#1d3a2f;color:#d9f7ea;font-size:13px;text-align:center;padding:6px 12px}
header{background:var(--dark);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
header img{display:block;width:182px;height:auto}
.btn{display:inline-block;background:var(--mint);color:#101216;text-decoration:none;font-weight:700;border-radius:999px;padding:14px 26px;font-size:17px;line-height:1.2;transition:background .15s}
.btn:hover,.btn:focus{background:var(--mint-hi)}
.btn.sm{padding:9px 16px;font-size:15px}
.hero{padding:44px 0 28px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mint);font-weight:700;margin-bottom:12px}
h1{font-size:clamp(32px,8vw,54px);line-height:1.08;letter-spacing:-.02em;margin-bottom:16px;font-weight:800}
h2{font-size:clamp(26px,5.5vw,36px);line-height:1.15;letter-spacing:-.01em;margin-bottom:14px;font-weight:800}
h3{font-size:18px;margin-bottom:4px}
.lead{font-size:19px;color:var(--muted);max-width:36em;margin-bottom:24px}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.alt{font-size:15px;color:var(--muted)}
.grid{display:grid;gap:28px}
section{padding:40px 0;border-top:1px solid var(--line)}
.sample{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--paper2);color:var(--muted);border:1px dashed #3d444e;border-radius:6px;padding:3px 8px;margin-bottom:12px}
.row{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.4}
.row:first-of-type{border-top:0}
.k{flex:0 0 76px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mint);padding-top:2px}
.row small{display:block;color:var(--muted)}
.pill{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:#1d3a2f;color:var(--mint)}
.list{list-style:none;display:grid;gap:16px}
.list li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.list p{color:var(--muted);font-size:16px}
.steps{list-style:none;counter-reset:s;display:grid;gap:16px}
.steps li{counter-increment:s;position:relative;padding-left:52px}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;background:var(--mint);color:#101216;font-weight:800;display:flex;align-items:center;justify-content:center}
.steps p{color:var(--muted);font-size:16px}
.checks{list-style:none;display:grid;gap:10px}
.checks li{padding-left:30px;position:relative}
.checks li:before{content:"";position:absolute;left:4px;top:7px;width:12px;height:7px;border-left:3px solid var(--mint);border-bottom:3px solid var(--mint);transform:rotate(-45deg)}
details{border-top:1px solid var(--line);padding:14px 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:700;list-style-position:outside}
details p{color:var(--muted);margin-top:8px;font-size:16px}
.final{background:#16231e;border:1px solid #2f4a3e;color:var(--ink);border-radius:20px;padding:32px 22px;text-align:center}
.final p{color:#c9d2ce;margin-bottom:20px}
.final .alt{color:#b9c2be}.final .alt a{color:var(--mint)}
footer{padding:28px 0 40px;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
footer nav{display:flex;gap:16px;flex-wrap:wrap}
.choose{padding:48px 0 40px;text-align:center}
.choose h1{margin-bottom:10px}
.choose .lead{margin:0 auto 28px}
.opts{display:grid;gap:14px;text-align:left}
.opt{display:block;width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 22px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.opt:hover,.opt:focus-visible{border-color:var(--mint);outline:none;transform:translateY(-2px)}
.opt b{display:block;font-size:24px;color:var(--mint);margin-bottom:4px}
.opt span{color:var(--muted);font-size:16px}
.back{background:none;border:0;color:var(--mint);font:inherit;font-size:15px;cursor:pointer;padding:0 0 14px;text-decoration:underline}
.final h2{margin-bottom:8px}
@media(min-width:860px){.opts{grid-template-columns:1fr 1fr 1fr}.choose{padding:88px 0 72px}.opt{padding:30px 26px}}
@media(min-width:860px){
 .hero{padding:72px 0 56px}
 .hero .grid{grid-template-columns:1.1fr .9fr;align-items:center;gap:48px}
 .list{grid-template-columns:1fr 1fr 1fr}
 .two{grid-template-columns:1fr 1fr;gap:48px}
 section{padding:64px 0}
 .final{padding:52px}
}
</style>
</head>
<body>
<div class="preview">Preview, not published</div>
<header>
 <div class="wrap">
  <a href="#top" aria-label="LaunchRiot home"><img src="logo_full.png" alt="LaunchRiot" width="242" height="64"></a>
  <a class="btn sm" id="hb" href="https://wa.me/971586444285?text=Hi%20LaunchRiot%2C%20I%27d%20like%20to%20book%20a%20demo.">Book a demo</a>
 </div>
</header>

<main id="top"><div id="app"></div>
<noscript><div class="wrap" style="padding:40px 20px"><p class="lead">LaunchRiot: a private assistant workspace for your email, calendar, chat messages and tasks. Nothing is sent without your approval. Email <a href="mailto:hello@launchriot.online">hello@launchriot.online</a> to book a demo.</p></div></noscript>
</main>
<footer>
 <div class="wrap">
  <span>© 2026 LaunchRiot · Founded by Clifford Landman</span>
  <nav><a href="terms.html">Terms (draft)</a><a href="privacy.html">Privacy (draft)</a><a href="mailto:hello@launchriot.online">hello@launchriot.online</a></nav>
 </div>
</footer>
<script>
(function(){
var P={
executive:{label:"Executive",pick:"For directors and senior leaders who want to see what needs them today.",
 h:"Your email, calendar and messages in one calm place.",
 lead:"A private assistant workspace that shows what needs you today, keeps track of tasks and follow-ups, and prepares draft replies. Nothing is sent until you approve it.",
 sample:[["Today","10:00 Leadership meeting","3 attendees"],["Email","Board pack for Thursday","From: Finance team (sample) · marked important"],["Message","\u201cCan we move the site visit to Monday?\u201d","From: Project lead (sample)"],["Follow-up","Supplier contract sent, no reply for 3 days","Reminder kept for you"]],
 draft:"Reply to the project lead: \u201cMonday works. 9:30?\u201d"},
business:{label:"Business",pick:"For owners and managers who run a team and need to keep everything moving.",
 h:"Run your day and your team from one place.",
 lead:"See your inbox, calendar and work chats together, capture tasks in seconds and see what your team owes you. Replies are prepared as drafts for you to approve.",
 sample:[["Today","14:00 Supplier call","2 attendees"],["Email","Quote request from a new customer (sample)","Marked important"],["Message","\u201cDelivery is confirmed for Wednesday.\u201d","From: Operations (sample)"],["Task","Send updated product list","Owed by: Team member (sample) · due Friday"]],
 draft:"Reply to the customer: \u201cThanks, the quote will be with you today.\u201d"},
personal:{label:"Personal",pick:"For anyone who wants their own email, plans and to-dos in order.",
 h:"Keep your own email, plans and to-dos in order.",
 lead:"One private place for your inbox, calendar and messages, with simple reminders for the things you need to follow up. Replies are prepared as drafts and nothing is sent without your approval.",
 sample:[["Today","18:30 Dinner with family","Calendar"],["Email","Appointment confirmation (sample)","From: Clinic (sample)"],["Message","\u201cAre we still on for Saturday?\u201d","From: Friend (sample)"],["Follow-up","Asked the school about forms, no reply yet","Reminder kept for you"]],
 draft:"Reply to your friend: \u201cYes, Saturday works.\u201d"}
};
var F=[["Email in one place","Your inbox with the important messages at the top, so you see what matters first."],["Your calendar","Today\u2019s meetings and who is attending, in the same place as your mail."],["Chat messages","Read your chats alongside email, instead of switching between apps."],["Tasks and follow-ups","Capture a task in seconds and see the emails still waiting for a reply."],["Drafts you approve","Replies are prepared as drafts. You read, edit and decide. Nothing goes out on its own."]];
var app=document.getElementById("app");
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function cta(k){var l=k?P[k].label.toLowerCase():"";var txt=k?"Hi LaunchRiot, I'd like to book a demo of the "+l+" setup.":"Hi LaunchRiot, I'd like to book a demo.";
 return '<a class="btn" href="https://wa.me/971586444285?text='+encodeURIComponent(txt)+'">Book a demo</a><span class="alt">or email <a href="mailto:hello@launchriot.online?subject='+encodeURIComponent("Book a demo"+(k?" - "+l+" setup":""))+'">hello@launchriot.online</a></span>';}
function chooser(){
 var o="";for(var k in P)o+='<button class="opt" type="button" data-k="'+k+'"><b>'+P[k].label+'</b><span>'+P[k].pick+'</span></button>';
 app.innerHTML='<div class="choose"><div class="wrap"><p class="eyebrow">LaunchRiot</p><h1>Who is this for?</h1><p class="lead">Choose the one that fits you best and we will show you what it looks like.</p><div class="opts">'+o+'</div></div></div>';
}
function path(k){var p=P[k],r="";
 p.sample.forEach(function(x){r+='<div class="row"><span class="k">'+x[0]+'</span><div>'+esc(x[1])+'<small>'+esc(x[2])+'</small></div></div>'});
 r+='<div class="row"><span class="k">Draft</span><div>'+esc(p.draft)+'<span class="pill">Waiting for your approval</span></div></div>';
 var f="";F.forEach(function(x){f+='<li><h3>'+x[0]+'</h3><p>'+x[1]+'</p></li>'});
 app.innerHTML='<div class="hero"><div class="wrap"><button class="back" type="button" data-k="">\u2190 Change choice</button><div class="grid"><div><p class="eyebrow">'+p.label+'</p><h1>'+p.h+'</h1><p class="lead">'+p.lead+'</p><div class="cta">'+cta(k)+'</div></div><div class="sample" aria-label="Sample screen with made-up content"><span class="tag">Sample screen. Made-up example, not a real customer.</span>'+r+'</div></div></div></div>'
 +'<section><div class="wrap"><h2>What you get</h2><ul class="list">'+f+'</ul></div></section>'
 +'<section><div class="wrap grid two"><div><h2>How it works</h2><ol class="steps"><li><h3>Book a demo</h3><p>A short call. We show you the workspace with sample content and listen to how you work.</p></li><li><h3>We set it up with you</h3><p>You choose what to connect. We do the setup together, step by step.</p></li><li><h3>You stay in charge</h3><p>Check what needs you and approve the drafts you want to send.</p></li></ol></div><div><h2>You stay in control</h2><ul class="checks"><li>Nothing is sent, deleted or changed without your approval.</li><li>You choose what to connect, and can disconnect at any time.</li><li>We do not sell your data or use it for advertising.</li></ul></div></div></section>'
 +'<section><div class="wrap"><div class="final"><h2>See it working before you decide.</h2><p>Book a short demo. No commitment.</p><div class="cta" style="justify-content:center">'+cta(k)+'</div></div></div></section>';
}
function render(){var k=location.hash.replace("#","");if(P[k])path(k);else chooser();window.scrollTo(0,0);document.getElementById("hb").href="https://wa.me/971586444285?text="+encodeURIComponent(P[k]?"Hi LaunchRiot, I'd like to book a demo of the "+P[k].label.toLowerCase()+" setup.":"Hi LaunchRiot, I'd like to book a demo.");
 var t=document.title.split(" | ")[0];document.title="LaunchRiot"+(P[k]?" | "+P[k].label:" | Who is this for?");}
app.addEventListener("click",function(e){var b=e.target.closest("[data-k]");if(!b)return;var k=b.getAttribute("data-k");
 if(k){location.hash=k}else{location.hash=""}});
window.addEventListener("hashchange",render);render();
})();
</script>
</body>
</html>
